<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>서정 출장서류</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽 출장 트리(출장 → 승인 → 결의) + 오른쪽 작업면. 미리보기는 한글 공문서 바탕체 느낌의 종이 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18222e; --muted:#5d6b7a; --line:#d5dce4;
  --accent:#1f4e8c; --accent-soft:#e3ecf7; --seal:#b63a2b; --seal-soft:#f8e6e2;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6b00; --warn-soft:#fbf1d6;
  --paper:#ffffff; --paper-ink:#111; --paper-line:#444;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-doc:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ef; --muted:#97a4b2; --line:#2c3642;
  --accent:#7fa8e0; --accent-soft:#1d2b3d; --seal:#e07a69; --seal-soft:#3a2420;
  --ok:#6cc08e; --ok-soft:#1b3326; --warn:#e2b54d; --warn-soft:#3a2f14;
  --paper:#f4f2ec; --paper-ink:#111; --paper-line:#444; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ef; --muted:#97a4b2; --line:#2c3642;
  --accent:#7fa8e0; --accent-soft:#1d2b3d; --seal:#e07a69; --seal-soft:#3a2420;
  --ok:#6cc08e; --ok-soft:#1b3326; --warn:#e2b54d; --warn-soft:#3a2f14;
  --paper:#f4f2ec; --paper-ink:#111; --paper-line:#444; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
@media (max-width:860px){.app{grid-template-columns:1fr}}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){aside{border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--f-doc);font-weight:800;font-size:17px;transform:rotate(-4deg)}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.tree{display:flex;flex-direction:column;gap:6px}
.tree .trip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:transparent;text-align:left;width:100%}
.tree .trip.on{border-color:var(--accent);background:var(--accent-soft)}
.tree .trip b{display:block;font-size:13.5px}
.tree .trip small{color:var(--muted);font-size:12px}
.tree ul{list-style:none;margin:6px 0 0;padding:0 0 0 12px;border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
.tree li{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tree li ul{margin-top:3px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.seal{background:var(--seal-soft);color:var(--seal)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
@media (max-width:860px){main{padding-inline:16px}}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn.pri{color:var(--panel)}
.btn.big{padding:11px 22px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f>span{font-weight:500;letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
:root:not([data-theme="light"]) .seg button.on{color:var(--panel)}
.trav{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:640px){.trav{grid-template-columns:1fr 1fr}}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
@media (max-width:640px){.file{grid-template-columns:1fr}}
.file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted)}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.flag ul{margin:4px 0 0;padding-left:18px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13px}
.err{background:var(--seal-soft);color:var(--seal);border-radius:8px;padding:10px 12px;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.paperwrap{overflow-x:auto;background:var(--line);border-radius:10px;padding:18px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);width:100%;max-width:760px;min-width:620px;margin:auto;padding:36px 34px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13.5px;line-height:1.6}
.paper h3{font-family:var(--f-doc);font-size:21px;font-weight:800;text-align:center;margin:0;text-wrap:balance}
.paper .yr{text-align:center;margin:2px 0 12px}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper td{word-break:keep-all;overflow-wrap:anywhere}
.paper td,.paper th{border:1px solid var(--paper-line);padding:5px 8px;vertical-align:middle}
.paper th{font-weight:700;background:#f1f1f1;text-align:center;white-space:nowrap}
.paper td.c{text-align:center}.paper td.r{text-align:right;font-variant-numeric:tabular-nums}
.paper .blk p{margin:0}
.paper .ed{cursor:text;border-radius:3px}
.paper .ed:hover{background:#fff6cc}
.paper .ed:focus{outline:2px solid #1f4e8c;background:#fffbe6}
.unsure{background:#fde7a6}
.chip{font-size:11.5px;color:var(--muted)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.steps span{padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.order{display:flex;flex-direction:column;gap:5px}
.order .it{display:flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.order .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .it button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th,.rtab td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
.rtab th{font-weight:600;color:var(--muted);font-size:12px}
.rtab input,.rtab select{padding:4px 6px;font-size:13px}
.rtab tr.unsure-row td{background:var(--warn-soft)}
.rtab tr.skip-row td{opacity:.45}
.rtab.sum td,.rtab.sum th{text-align:right}.rtab.sum td:first-child,.rtab.sum th:first-child{text-align:left}
.rtab .over{color:var(--seal);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:9}
</style>

    <div class="brand"><div class="mark">서</div><div><b>서정 출장서류</b><small>입학본부 · 출장 승인에서 결의까지</small></div></div>

    <div class="note" id="conn"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

/* 원본 운영계획서 HWPX(section0.xml)에 값만 바꿔 넣는다. 표·셀 병합·글꼴·문단 모양은 원본 그대로 둔다.
   spec = { title, dept, fund, st, ex, pg, code, sub, goals[], plan[{kind:'head'|'item'|'effect', text}], remarks[], rows[{calc, amt}], total }
   브라우저(DOMParser)와 node(@xmldom/xmldom) 양쪽에서 쓰도록 파서를 인자로 받는다. */
function fillSection(xml, spec, P){
  const doc = new P.DOMParser().parseFromString(xml, 'text/xml');
  const all = (el, tag) => Array.from(el.getElementsByTagName(tag));
  const kids = (el, tag) => Array.from(el.childNodes).filter(n => n.nodeName === tag);
  const textOf = el => all(el, 'hp:t').map(t => t.textContent).join('');

  // 레이아웃 캐시는 지워서 한글이 열 때 다시 계산하게 한다
  all(doc, 'hp:linesegarray').forEach(n => n.parentNode.removeChild(n));

  const setParaText = (p, text) => {
    const runs = kids(p, 'hp:run');
    const keep = runs.filter(r => all(r, 'hp:t').length).pop() || runs[0];
    runs.forEach(r => { if (r !== keep && !all(r, 'hp:tbl').length && !all(r, 'hp:ctrl').length && !all(r, 'hp:secPr').length) p.removeChild(r); });
    all(keep, 'hp:t').forEach(t => t.parentNode.removeChild(t));
    const t = doc.createElementNS(keep.namespaceURI, 'hp:t'); t.appendChild(doc.createTextNode(text)); keep.appendChild(t);
  };
  const cellParas = tc => kids(kids(tc, 'hp:subList')[0], 'hp:p');
  const setCell = (tc, lines) => {
    lines = [].concat(lines);
    const sl = kids(tc, 'hp:subList')[0], ps = kids(sl, 'hp:p'), proto = ps[0];
    ps.slice(1).forEach(p => sl.removeChild(p));
    setParaText(proto, lines[0] ?? '');
    lines.slice(1).forEach(l => { const c = proto.cloneNode(true); setParaText(c, l); sl.appendChild(c); });
  };
  const literal = (p, mark) => textOf(p).trim().startsWith(mark);
  const strip = s => s.replace(/^\s*[□\-]\s*/, '');

  const tcs = all(doc, 'hp:tc');
  const cellText = tc => textOf(tc).replace(/\s+/g, ' ').trim();
  const nextCell = label => {
    const tc = tcs.find(c => cellText(c) === label);
    if (!tc) return null;
    let n = tc.nextSibling; while (n && n.nodeName !== 'hp:tc') n = n.nextSibling;
    return n;
  };
  const col = tc => Number(kids(tc, 'hp:cellAddr')[0].getAttribute('colAddr'));

  // 제목: 첫 '구분' 칸보다 앞에 있는 글자(별첨 머리표 제외). 원본은 제목을 표 첫 줄에 둔다
  const gubun = tcs.find(c => cellText(c) === '구분');
  const before = t => !gubun || (gubun.compareDocumentPosition ? (gubun.compareDocumentPosition(t) & 2) : allTs.indexOf(t) < allTs.indexOf(all(gubun, 'hp:t')[0]));
  const allTs = all(doc, 'hp:t');
  const titleTs = allTs.filter(t => before(t) && t.textContent.trim() && !/^\[별첨/.test(t.textContent.trim()));
  if (titleTs.length) { titleTs[0].textContent = spec.title; titleTs.slice(1).forEach(t => { t.textContent = ''; }); }

  // 한 칸짜리 값
  const single = { '운영부서': spec.dept, '전략과제': spec.st, '실행과제': spec.ex, '프로그램명': spec.pg, '프로그램 코드': spec.code, '세부프로그램명': spec.sub };
  for (const [k, v] of Object.entries(single)) { const c = nextCell(k); if (c && v != null) setCell(c, v); }
  if (spec.fund) { const c = nextCell('구분'); if (c && !cellText(c).includes(spec.fund)) setCell(c, spec.fund); }

  // 문단 블록: 원본에서 같은 종류 문단을 골라 복제
  const block = (label, lines, protoPick) => {
    const tc = nextCell(label); if (!tc) return;
    const sl = kids(tc, 'hp:subList')[0], ps = kids(sl, 'hp:p');
    const protos = protoPick(ps);
    ps.forEach(p => sl.removeChild(p));
    for (const l of lines) {
      const pr = protos[l.kind] || protos.head;
      const c = pr.cloneNode(true);
      const mark = l.kind === 'head' ? '□' : '-';
      setParaText(c, (literal(pr, mark) ? mark + ' ' : '') + strip(l.text));
      sl.appendChild(c);
    }
  };
  const firstReal = ps => ps.find(p => textOf(p).trim()) || ps[0];
  block('추진목표', spec.goals.map(text => ({ kind: 'head', text })), ps => ({ head: firstReal(ps) }));
  block('비고', spec.remarks.map(text => ({ kind: 'head', text })), ps => ({ head: firstReal(ps) }));
  block('추진계획', spec.plan, ps => {
    const head = firstReal(ps);
    const item = ps.find(p => /^-?\s*\d{1,2}\.\d{1,2}/.test(textOf(p).trim())) || head;
    const ei = ps.findIndex(p => textOf(p).includes('기대효과'));
    const effect = (ei >= 0 && ps[ei + 1]) || item;
    return { head, item, effect };
  });

  // 소요예산 행
  const trs = all(doc, 'hp:tr');
  const hi = trs.findIndex(tr => kids(tr, 'hp:tc').some(c => cellText(c) === '산출내역'));
  const ti = trs.findIndex((tr, i) => i > hi && kids(tr, 'hp:tc').some(c => cellText(c) === '합계'));
  if (hi >= 0 && ti > hi) {
    const hc = kids(trs[hi], 'hp:tc'), cCalc = col(hc.find(c => cellText(c) === '산출내역')), cAmt = col(hc.find(c => cellText(c) === '금액(원)'));
    const data = trs.slice(hi + 1, ti).map(tr => ({ calc: kids(tr, 'hp:tc').find(c => col(c) === cCalc), amt: kids(tr, 'hp:tc').find(c => col(c) === cAmt) })).filter(r => r.calc && r.amt);
    const rows = spec.rows, R = data.length;
    data.forEach((d, i) => {
      if (i < R - 1 || rows.length <= R) { const r = rows[i]; setCell(d.calc, r ? r.calc : ''); setCell(d.amt, r ? r.amt : ''); }
      else { const rest = rows.slice(i); setCell(d.calc, rest.map(r => r.calc)); setCell(d.amt, rest.map(r => r.amt)); }
    });
    const tot = kids(trs[ti], 'hp:tc').find(c => col(c) === cAmt) || kids(trs[ti], 'hp:tc').find(c => /^[\d,]+$/.test(cellText(c)));
    if (tot) setCell(tot, spec.total);
  }
  return new P.XMLSerializer().serializeToString(doc);
}

async function buildHwpx(templateBytes, spec, JSZip, P){
  const src = await JSZip.loadAsync(templateBytes), out = new JSZip();
  out.file('mimetype', await src.file('mimetype').async('uint8array'), { compression: 'STORE' });
  for (const name of Object.keys(src.files)) {
    const f = src.files[name]; if (f.dir || name === 'mimetype') continue;
    if (name === 'Contents/section0.xml') out.file(name, fillSection(await f.async('string'), spec, P));
    else out.file(name, await f.async('uint8array'));
  }
  return out.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/hwp+zip' });
}

/* 웹 버전 저장소: 이 브라우저의 IndexedDB (출장 기록 + 올린 파일) */
const IDB = {
  db: null,
  open(){ return this.db || (this.db = new Promise((ok, no) => { const q = indexedDB.open('seojeong-trip', 1);
    q.onupgradeneeded = () => { q.result.createObjectStore('trips'); q.result.createObjectStore('files'); };
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); })); },
  async tx(store, mode, fn){ const d = await this.open(); return new Promise((ok, no) => { const t = d.transaction(store, mode), st = t.objectStore(store); const r = fn(st); t.oncomplete = () => ok(r?.result); t.onerror = () => no(t.error); }); },
  put(store, key, val){ return this.tx(store, 'readwrite', st => st.put(val, key)); },
  get(store, key){ return this.tx(store, 'readonly', st => st.get(key)); },
  del(store, key){ return this.tx(store, 'readwrite', st => st.delete(key)); },
  all(store){ return this.tx(store, 'readonly', st => st.getAll()); }
};
const Store = {
  async save(t){ const data=JSON.parse(JSON.stringify(t)); if (MODE==='web') return IDB.put('trips', t.id, data); delete data.id; if (db) return db.collection('trips').doc(t.id).set(data); memTrips.set(t.id,t); },

/* 예산 코드 기준표 엑셀 → 프로그램 목록 (app/extract_budget.py와 같은 규칙).
   공개 웹 버전은 코드표를 사이트에 넣지 않고, 사용자가 올린 엑셀을 이 브라우저에만 저장한다. */
const OLD_CONFIRMED = {'D6c4393-2':'D324293-1'};   // 하노이·스리랑카 실제 운영계획서 병기값
function sheetRows(ws){
  const R=XLSX.utils.decode_range(ws['!ref']||'A1'), out=[];
  for (let r=0;r<=R.e.r;r++){ const row=[]; for (let c=0;c<=R.e.c;c++){ const v=ws[XLSX.utils.encode_cell({r,c})]; row.push(v?v.v:null); } out.push(row); }
  return out;
}
async function parseBudgetFiles(files){
  const clean=x=>x==null?'':String(x).replace(/\s+/g,' ').trim();
  let main=null, old9=[];
  for (const f of files){
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}), names=wb.SheetNames;
    const anchor=names.find(n=>n.startsWith('앵커')), hasOld = anchor && sheetRows(wb.Sheets[anchor])[3]?.some(h=>String(h||'').includes('舊'));
    if (names.includes('혁신지원사업') && anchor && !hasOld) main={wb,anchor,name:f.name};
    else if (hasOld) old9=sheetRows(wb.Sheets[anchor]).slice(4).filter(r=>r[20]).map(r=>({pg:clean(r[18]),nc:clean(r[20]),oc:clean(r[21])}));
  }
  if (!main) throw new Error('2026.9.15 기준 프로그램 코드 엑셀(등록금·혁신지원사업·앵커사업 시트)을 올려 주세요.');
  const W=main.wb.Sheets, out=[];
  sheetRows(W['등록금']).slice(4).forEach(r=>{ if(r[20]) out.push({b:'등록금',st:clean(r[5]),ex:clean(r[8]),pg:clean(r[18]),bm:clean(r[16]),dp:clean(r[19]),nc:clean(r[20]),oc:clean(r[21])}); });
  sheetRows(W['혁신지원사업']).slice(4).forEach(r=>{ if(r[31]) out.push({b:'혁신',st:`${clean(r[8])}.${clean(r[10])}. ${clean(r[11])}`,ex:`${clean(r[8])}.${clean(r[10])}.${clean(r[12])} ${clean(r[13])}`,pg:clean(r[29]),bm:clean(r[27]),dp:clean(r[30]),nc:clean(r[31]),oc:clean(r[32])}); });
  sheetRows(W[main.anchor]).slice(4).forEach(r=>{ if(!r[20]) return;
    const nc=clean(r[20]), pg=clean(r[12]).replace(/^\[[^\]]*\]\s*/,'');
    const cand=[...new Set(old9.filter(o=>o.pg===pg && o.nc.slice(-3,-2)===nc.slice(-3,-2)).map(o=>o.oc))];
    const row={b:'앵커',st:`${clean(r[2])}.${clean(r[4])}.${clean(r[5])}`,ex:clean(r[8]),pg,sub:clean(r[18]),bm:clean(r[16]),dp:clean(r[19]),nc,oc:''};
    if (OLD_CONFIRMED[nc]) row.oc=OLD_CONFIRMED[nc]; else if (cand.length===1){ row.oc=cand[0]; row.og=1; }
    out.push(row); });
  return {rows:out, source:main.name, anchorOld:old9.length>0};
}

/* 웹 버전 AI: 설정에 넣은 본인 API 키로 Anthropic 공식 SDK를 브라우저에서 직접 호출. 키는 이 브라우저(localStorage)에만 저장 */

async function claudeClient(){

function parseJsonText(text){
  const t=text.replace(/^```(?:json)?\s*|\s*```$/g,'').trim();
  try { return JSON.parse(t); } catch {}
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if (a>=0 && b>a) return JSON.parse(t.slice(a,b+1));
  throw new Error('AI 응답을 읽지 못했습니다. 다시 시도해 주세요.');
}
const AI = {   // tier: 'quick'(파일 읽기) · 'complex'(본문 작성)
  async json(prompt, tier='complex', opts={}){
    if (MODE!=='web'){ if (!sample) throw Object.assign(new Error('AI 작성 기능에 연결되지 않았습니다.'),{code:'no_sample'}); return sample.json(prompt, {modelTier:tier, ...opts}); }
    const client=await claudeClient(), model=MODELS[tier](), content=[];
    for (const img of [].concat(opts.images||[])) content.push({type:'image', source:{type:'base64', media_type: img.type||'image/jpeg', data: await blobToB64(img)}});

    const req={ model, max_tokens:16000, messages:[{role:'user', content}] };
    let res;
    if (model.startsWith('claude-opus') || model.startsWith('claude-fable')){
      req.output_config={effort:'high'};
      res=await client.beta.messages.create({...req, betas:['server-side-fallback-2026-07-01'], fallbacks:'default'});   // 안전 분류기가 거절하면 서버가 다른 모델로 이어서 처리
    } else res=await client.messages.create(req);
    if (res.stop_reason==='refusal') throw new Error('AI가 이 요청을 처리하지 않았습니다. 문구를 바꿔 다시 시도해 주세요.');
    return parseJsonText(res.content.filter(b=>b.type==='text').map(b=>b.text).join(''));
  },

function budgetOptions(type, dept, q){
  q = (q||'').trim();
  const seen = new Set();
  return BUDGET.filter(r => r.b===type && (!dept || r.dp===dept) && !seen.has(r.nc) && seen.add(r.nc))
    .filter(r => !q || [r.pg,r.sub,r.nc,r.oc,r.dp,r.ex,r.st].join(' ').includes(q));
}
function deptsOf(type){ const c={}; BUDGET.forEach(r=>{ if(r.b===type) c[r.dp]=(c[r.dp]||0)+1; }); return Object.keys(c).sort((a,b)=> (b==='입학본부')-(a==='입학본부') || a.localeCompare(b,'ko')); }
function budgetPicker(key, label){
  if (!BUDGET.length) return `<div class="card stack"><h2>${label} 예산</h2><div class="flag">예산 코드표가 아직 없습니다. 왼쪽 ‘설정 · 백업’에서 2026.9.15 기준 프로그램 코드 엑셀을 올려 주세요.</div></div>`;
  const t = S.cur, cur = t.budget[key];
  const type = cur?.b || (key==='fee' ? '등록금' : '앵커');
  const dept = t['_d'+key] ?? (cur?.dp || '입학본부');
  const opts = budgetOptions(type, dept, t['_q'+key]);
  return `<div class="card stack">
    <h2>${label} 예산</h2>
    <div class="seg" data-btype="${key}">${['등록금','혁신','앵커'].map(b=>`<button type="button" data-b="${b}" class="${type===b?'on':''}">${b}</button>`).join('')}</div>

    <label class="f"><span>프로그램 검색 (이름·코드)</span><input type="text" id="q_${key}" value="${esc(t['_q'+key]||'')}" placeholder="예: 정주, D6c4393, 해외대학"></label>
    <label class="f"><span>프로그램</span><select id="sel_${key}">
      <option value="">${opts.length} 개 중 선택</option>
      ${opts.slice(0,300).map(r=>`<option value="${r.nc}" ${cur?.nc===r.nc?'selected':''}>${esc(r.nc)} · ${esc(r.pg)}${r.sub&&r.sub!==r.pg?' / '+esc(r.sub):''} </option>`).join('')}
    </select></label>

  </div>`;
}

function fileRows(files){

  return files.map((f,i)=>`<div class="file"><span class="nm" title="${esc(f.name)}">${esc(f.name)}</span>
    <select data-frole="${i}">${roles.map(r=>`<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <button type="button" class="x" data-rmf="${i}" aria-label="파일 삭제">×</button></div>`).join('');
}
const ROLES = ['출장신청서','외부 공문·안내','항공 이티켓','항공 결제 영수증','숙박 결제 영수증','비자 영수증','견적서','기타 첨부'];
function guessRole(name){
  if (/사용신청서/.test(name)) return '기타 첨부';
  if (/신청서|허가원/.test(name)) return '출장신청서';
  if (/비자|visa/i.test(name)) return '비자 영수증';
  const rc=/영수증|receipt|결제/i.test(name);
  if (/이티켓|e-?ticket|항공|출발편|귀국편|flight|itinerary/i.test(name)) return rc ? '항공 결제 영수증' : '항공 이티켓';
  if (/호텔|숙박|숙소|hotel|agoda|booking/i.test(name)) return rc ? '숙박 결제 영수증' : '기타 첨부';
  if (/견적|리플|현수막/.test(name)) return '견적서';
  if (/공문|안내|협의회|박람회|초청/.test(name)) return '외부 공문·안내';
  return '기타 첨부';
}
function collect(){
  const t=S.cur, v=id=>document.getElementById(id);
  if (v('place')) t.place=v('place').value;
  if (v('start')) t.start=v('start').value;
  if (v('end')) t.end=v('end').value;
  if (v('memo')) t.memo=v('memo').value;
  if (v('rateToday')) t.rateToday=v('rateToday').value;
  if (v('rate')) { const auto=planRate(num(t.rateToday)), val=num(v('rate').value)||auto; t.rateManual = v('rate').dataset.touched==='1' ? val!==auto : !!t.rateManual; t.rate = t.rateManual ? val : auto; }
  if (v('flight')) t.flight=num(v('flight').value);
  if (v('hotel')) t.hotel=num(v('hotel').value);
  if (v('feeEvent')) t.feeEvent=v('feeEvent').value;

  document.querySelectorAll('[data-fr]').forEach(el=>{ const [i,k]=el.dataset.fr.split(':'); t.feeRows[i][k]= k==='amt'?num(el.value):el.value; });

  ['travel','fee'].forEach(k=>{ const q=document.getElementById('q_'+k); if(q) t['_q'+k]=q.value; });
  S.dirty=true;
}

/* ---------- 파일 보관 ---------- */
const blobCache = new Map();
async function addFiles(list){
  collect();
  const t=S.cur; $('#readMsg').innerHTML='<span class="spin"></span> 파일을 저장하는 중';
  for (const file of list){
    const rec={id:uid(), name:file.name, type:file.type||'application/pdf', role:guessRole(file.name), size:file.size};
    blobCache.set(rec.id, file);
    try{ Object.assign(rec, await Files.put(file, rec.id)); }catch(e){ rec.err=e.message; }
    t.files.push(rec);
  }
  if (db) await saveTrip(t);
  renderInput($('#main'));
  if (!assets && MODE!=='web') $('#readMsg').textContent='파일 저장소에 연결되지 않아 이 창에서만 쓸 수 있습니다.';
}
async function fileBlob(f){
  if (blobCache.has(f.id)) return blobCache.get(f.id);
  const b = await Files.get(f); blobCache.set(f.id,b); return b;
}
async function pdfText(f, maxPages=6){
  const b = await fileBlob(f);
  if (!/pdf/.test(f.type) && !/\.pdf$/i.test(f.name)) return '';
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await b.arrayBuffer()), isEvalSupported:false}).promise;
  let out=''; for (let i=1;i<=Math.min(doc.numPages,maxPages);i++){ const c=await (await doc.getPage(i)).getTextContent(); out+=c.items.map(x=>x.str).join(' ')+'\n'; }
  return out.replace(/\s+\n/g,'\n').slice(0,8000);
}

/* ---------- 금액 계산 ---------- */
function travelerDays(t,p){ return dayCount(p.start||t.start, p.end||t.end); }
function travelBudget(t){
  const rate=t.rate||1500, ps=t.travelers.filter(p=>p.name||t.travelers.length===1), n=ps.length||1;
  const groups={}; ps.forEach(p=>{ const d=travelerDays(t,p); const k=p.rank+'|'+d; (groups[k]=groups[k]||{rank:p.rank,days:d,n:0}).n++; });
  const G=Object.values(groups), rows=[];
  if (t.pay==='personal'){
    const f=t.flight||0, h=t.hotel||0;
    rows.push({cat:'항공운임비', calc: n>1 && f%n===0 ? `항공운임비 ${won(f/n)}원*${n}인` : `항공운임비 ${won(f)}원${n>1?' (실결제 합계)':'*1인'}`, amt:f});
    rows.push({cat:'숙박비', calc: n>1 && h%n===0 ? `숙박비 ${won(h/n)}원*${n}인` : `숙박비 ${won(h)}원${n>1?' (실결제 합계)':'*1인'}`, amt:h});
  } else {
    const f=t.flight||0;
    rows.push({cat:'항공운임비', calc:`항공운임비 ${won(f)}원*${n}인`, amt:f*n});
    G.forEach(g=>rows.push({cat:'숙박비', calc:`숙박비 ${won(rate)}*${RANKS[g.rank].hotel}USD*${g.days-1}박*${g.n}인`, amt:rate*RANKS[g.rank].hotel*(g.days-1)*g.n}));
  }
  G.forEach(g=>rows.push({cat:'식비', calc:`식비 ${won(rate)}*${RANKS[g.rank].meal}USD*${g.days}일*${g.n}인`, amt:rate*RANKS[g.rank].meal*g.days*g.n}));
  G.forEach(g=>rows.push({cat:'일비', calc:`일비 ${won(rate)}*${RANKS[g.rank].day}USD*${g.days}일*${g.n}인`, amt:rate*RANKS[g.rank].day*g.days*g.n}));
  return {group:'교원 국외여비', rows};
}
function rateLine(t){
  const r=String(t.rateToday||'').replace(/,/g,'');
  if (!r) return '□ 해외출장 환율 기준은 승인건 작성일 기준 ○○○원으로 책정';
  const n=Number(r), fl=Math.floor(n), cut=+(n-fl).toFixed(2);
  return `□ 해외출장 환율 기준은 승인건 작성일 기준 ${won(fl)}원으로 책정${cut?` (${cut}원 절삭)`:''}`;
}

function fallbackDraft(t, ap){
  const ds=datesBetween(t.start,t.end), place=t.place||'현지', b=ap.budget;
  const memo=(t.memo||'').split(/[,\n·]/).map(s=>s.trim()).filter(Boolean);
  const items=ds.map((d,i)=>({date:d, text: i===0?`출국(인천 → ${place})`: i===ds.length-1?`입국(${place} → 인천)` : memo[i-1] ? memo[i-1] : `현지 협력기관 방문 및 ${b.pg} 관련 협력방안 협의`}));
  return {sub: `${place} ${b.pg}`, title:`${place} ${b.pg}`, goals:[`${place} 현지 기관과의 협력을 통한 ${b.pg} 기반 강화`,'현지 관계기관과의 교류를 통한 국제학생 지원체계 내실화','후속 협력 과제 발굴을 통한 지속가능한 협력 기반 마련'], items, effects:['현지 기관과의 협력 채널 확보','국제학생 지원 프로세스 공유 및 지원체계 개선','후속 협력사업 추진 기반 마련'], place, unsure:['AI 작성이 연결되지 않아 기본 문구로 채웠습니다. 문장을 직접 다듬어 주세요.', ...items.slice(1,-1).filter((x,i)=>!memo[i]).map(x=>fmtShort(x.date)+' 활동 확인 필요')]};
}

async function generate(){
  const t=S.cur;
  const errs=[];
  if (!t.start||!t.end) errs.push('출국일과 귀국일');
  if (!t.travelers.some(p=>p.name)) errs.push('출장자 이름');
  if (t.kinds.travel && !t.budget.travel?.nc) errs.push('출장 승인 예산 프로그램');
  if (t.kinds.fee && !t.budget.fee?.nc) errs.push('분담금 승인 예산 프로그램');
  if (!t.kinds.travel && !t.kinds.fee) errs.push('만들 승인 종류');
  if (errs.length){ $('#genMsg').innerHTML=`<span class="err">${errs.join(', ')}을(를) 넣어 주세요.</span>`; return; }
  if (!t.name) t.name = `${(t.start||'').slice(2,7).replace('-','.')} ${t.place||'출장'}`;
  t.writtenAt = today();
  const want=[]; if(t.kinds.fee) want.push('fee'); if(t.kinds.travel) want.push('travel');
  for (const kind of want){
    let ap=t.approvals.find(a=>a.kind===kind);
    if (!ap){ ap={id:uid(), kind}; t.approvals.push(ap); }
    ap.budget={...t.budget[kind]}; if (kind==='travel') ap.pay=t.pay;
  }
  t.approvals=t.approvals.filter(a=>want.includes(a.kind));
  S.apId=t.approvals[0].id; S.view='review';
  await saveTrip(t); render(); renderTree();
  for (const ap of t.approvals) await draft(t, ap);
}
async function draft(t, ap){
  ap.drafting=true; render();
  let d;
  try { d = await ask(draftPrompt(t, ap)); ap.ai=true; }
  catch(e){ d = fallbackDraft(t, ap); ap.ai=false; ap.aiErr = e.code==='no_sample' ? '' : (e.message||''); }
  const ds=datesBetween(t.start,t.end);
  const map=new Map((d.items||[]).map(x=>[x.date,x.text]));
  ap.doc={
    sub:d.sub||'', title:d.title||d.sub||'',
    goals:(d.goals||[]).slice(0,4), effects:(d.effects||[]).slice(0,5),
    items: ds.map(x=>({date:x, text: map.get(x)||''})),
    place:d.place||t.place, unsure:d.unsure||[], dept:'입학본부'
  };
  ap.drafting=false; ap.planPdf=null; ap.mergedAt=null;
  await saveTrip(t); render(); renderTree();
}

}

function evidenceList(t, ap){
  const order=['출장신청서','외부 공문·안내','항공 이티켓','항공 결제 영수증','숙박 결제 영수증','비자 영수증','견적서','기타 첨부'];
  let list = ap.order ? ap.order.map(id=>t.files.find(f=>f.id===id)).filter(Boolean) : t.files.slice().sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role));
  if (ap.kind==='fee') list=list.filter(f=>!['항공 이티켓','항공 결제 영수증','숙박 결제 영수증'].includes(f.role));
  return list;
}
function missing(t, ap){
  const has=r=>t.files.some(f=>f.role===r), out=[];
  if (ap.kind==='travel'){
    if (!has('출장신청서')) out.push('출장신청서');
    if (ap.pay==='personal'){ if(!has('항공 이티켓')) out.push('항공 이티켓'); if(!has('항공 결제 영수증')) out.push('항공 결제 영수증 (금액은 영수증에서 읽습니다)'); if(!has('숙박 결제 영수증')) out.push('숙박 결제 영수증'); if(!t.flight) out.push('항공 실결제 금액'); if(!t.hotel) out.push('숙박 실결제 금액'); }
    if (ap.pay==='corp' && !t.flight) out.push('항공 1인 금액(이코노미 최고 요금)');
    if (!t.rateToday) out.push('작성일 기준 환율');
  } else {
    if (!(t.feeRows||[]).some(r=>r.amt)) out.push('분담금 금액');
    if (!t.feePayee) out.push('납부처');
  }
  if (!ap.budget.oc) out.push('구코드(기준표에 없음)');
  return out;
}

function bindReview(t, ap){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.apId=b.dataset.tab; render();});
  const et=$('#editTrip'); if (et) et.onclick=()=>{S.view='input'; render();};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>askDelete(b.dataset.del, t, ap));
  if (!ap.doc || ap.drafting) return;
  document.querySelectorAll('[data-ed]').forEach(el=>{
    el.onblur=async()=>{
      const [k,i]=el.dataset.ed.split('.'), v=el.textContent.trim();
      if (k==='title'){ ap.doc.title=v.replace(/\s*(분담금 및 운영비 납부 )?운영계획서$/,''); }
      else if (i!==undefined){ if(k==='items') ap.doc.items[i].text=v; else ap.doc[k][i]=v; }
      else ap.doc[k]=v;
      ap.planPdf=null; await saveTrip(t); renderTree();
    };
    el.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); el.blur(); } };
  });
  $('#apDoc').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const rec={id:uid(), name:f.name, type:f.type||'application/pdf'}; blobCache.set(rec.id,f);
    try{ Object.assign(rec, await Files.put(f, rec.id)); }catch{} ap.approvalDoc=rec; ensureResolutions(ap); await saveTrip(t); render(); renderTree(); toast('승인공문을 연결했습니다'); };
  $('#goRes').onclick=async()=>{ ensureResolutions(ap); await saveTrip(t); openRes(t.id, ap.id, null); };
  $('#doInstr').onclick=async()=>{
    const ins=$('#instr').value.trim(); if(!ins) return;
    $('#instrMsg').innerHTML='<span class="spin"></span> 반영 중';
    try{
      const res=await ask(`아래 운영계획서 문장 JSON을 지시에 맞게 고쳐 같은 구조의 JSON만 답하세요. 지시와 관계없는 부분은 글자 하나 바꾸지 마세요. 날짜(date)는 바꾸지 마세요. 규칙: 날짜별 주요 활동 하나, 관광 제외, 없는 사실을 확정처럼 쓰지 않음, unsure는 아직 확인이 필요한 것만 남김.
지시: ${ins}
${JSON.stringify({sub:ap.doc.sub,title:ap.doc.title,goals:ap.doc.goals,items:ap.doc.items,effects:ap.doc.effects,place:ap.doc.place,unsure:ap.doc.unsure})}`);
      Object.assign(ap.doc, {sub:res.sub??ap.doc.sub, title:res.title??ap.doc.title, goals:res.goals||ap.doc.goals, effects:res.effects||ap.doc.effects, place:res.place||ap.doc.place, unsure:res.unsure||[]});
      if (Array.isArray(res.items)) ap.doc.items=ap.doc.items.map(x=>({date:x.date, text:(res.items.find(y=>y.date===x.date)||x).text}));
      ap.planPdf=null; await saveTrip(t); render(); toast('반영했습니다');
    }catch(e){ $('#instrMsg').textContent = e.code==='no_sample'?'AI 기능이 연결되지 않아 문서를 직접 눌러 고쳐 주세요.':'반영하지 못했습니다: '+e.message; }
  };
  $('#redraft').onclick=()=>{ ap.extra=$('#instr').value.trim(); draft(t, ap); };
  $('#copyHwp').onclick=()=>copyForHwp(t,ap);
  $('#getHwpx').onclick=()=>downloadHwpx(t,ap);
  $('#makePlanPdf').onclick=async()=>{
    const msg=$('#mergeMsg'); msg.innerHTML='<span class="spin"></span> PDF를 만드는 중';
    try{
      const blob=await planToPdf(t,ap), name=`${fileBase(ap)} 운영계획서.pdf`.replace(/[\\/:*?"<>|]/g,'_');
      const rec={id:uid(), name, type:'application/pdf', auto:true}; blobCache.set(rec.id, blob);
      try{ Object.assign(rec, await Files.put(new File([blob], name, {type:'application/pdf'}), rec.id)); }catch{}
      ap.planPdf=rec; await saveTrip(t); render(); renderTree(); toast('운영계획서 PDF를 만들었습니다');
      try{ await Out.save(name, blob); }catch{}

/* 한글 페이지만 남긴다. 한글 페이지가 하나도 없는 파일(영문 전용 영수증, 스캔본)은 그대로 둔다 */
async function koreanPages(bytes){
  const doc=await pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported:false}).promise, counts=[];
  for (let i=1;i<=doc.numPages;i++){ const c=await (await doc.getPage(i)).getTextContent(); counts.push((c.items.map(x=>x.str).join('').match(/[가-힣]/g)||[]).length); }
  const keep=counts.map((n,i)=>n>=30?i:-1).filter(i=>i>=0);   // 영문 페이지는 이름 등 한글이 10자 안팎
  return keep.length ? keep : counts.map((_,i)=>i);
}

/* 운영계획서 미리보기를 그대로 PDF로 (한글 프로그램 출력과 줄바꿈이 조금 다를 수 있음) */
async function planToPdf(t, ap){
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';
  holder.innerHTML=paperHTML(t,ap,false); document.body.append(holder);
  const paper=holder.querySelector('.paper'); paper.style.cssText='width:794px;max-width:none;min-width:0;box-shadow:none;margin:0;padding:48px 52px';
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(paper,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {PDFDocument}=PDFLib, pdf=await PDFDocument.create(), W=595.28, H=841.89;
    const pxPerPage=Math.floor(canvas.width*H/W);
    // 표 줄 사이에서 쪽을 나누기 위해 흰 줄을 찾는다
    const ctx=canvas.getContext('2d');
    const blankRow=y=>{ const d=ctx.getImageData(0,y,canvas.width,1).data; let dark=0; for(let i=0;i<d.length;i+=16) if(d[i]<120) dark++; return dark; };
    let y=0;
    while (y < canvas.height){
      let end=Math.min(y+pxPerPage, canvas.height);
      if (end<canvas.height){ let best=end, bestDark=1e9; for (let yy=end; yy>end-260 && yy>y+200; yy-=2){ const k=blankRow(yy); if (k<bestDark){ bestDark=k; best=yy; } if (k===0) break; } end=best; }
      const c=document.createElement('canvas'); c.width=canvas.width; c.height=pxPerPage; const cx=c.getContext('2d');
      cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(canvas,0,y,canvas.width,end-y,0,0,canvas.width,end-y);
      const img=await pdf.embedPng(await (await new Promise(r=>c.toBlob(r,'image/png'))).arrayBuffer());
      pdf.addPage([W,H]).drawImage(img,{x:0,y:0,width:W,height:H});
      y=end;
    }
    return new Blob([await pdf.save()],{type:'application/pdf'});
  } finally { holder.remove(); }
}

async function mergePdf(t, ap){
  const msg=$('#mergeMsg'); msg.innerHTML='<span class="spin"></span> PDF를 합치는 중';
  try{
    const {PDFDocument}=PDFLib, out=await PDFDocument.create(), skipped=[]; let dropped=0;
    const parts=[ap.planPdf, ...evidenceList(t,ap)];
    for (const f of parts){
      const bytes=new Uint8Array(await (await fileBlob(f)).arrayBuffer());
      if (/pdf/.test(f.type)||/\.pdf$/i.test(f.name)){
        const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
        const keep = f===ap.planPdf ? src.getPageIndices() : await koreanPages(bytes);
        dropped += src.getPageCount()-keep.length;
        (await out.copyPages(src, keep)).forEach(p=>out.addPage(p));
      } else if (/png|jpe?g/i.test(f.type)){
        const img=/png/i.test(f.type)?await out.embedPng(bytes):await out.embedJpg(bytes);
        const W=595.28,H=841.89,s=Math.min((W-40)/img.width,(H-40)/img.height,1), page=out.addPage([W,H]);
        page.drawImage(img,{x:(W-img.width*s)/2,y:(H-img.height*s)/2,width:img.width*s,height:img.height*s});
      } else skipped.push(f.name);
    }
    if (skipped.length){ msg.innerHTML=`<span class="err">PDF로 바꿔서 다시 올려야 하는 파일: ${skipped.map(esc).join(', ')}</span>`; return; }
    const bytes=await out.save(), name=`${fileBase(ap)} 승인증빙 일체.pdf`.replace(/[\\/:*?"<>|]/g,'_');
    await Out.save(name, new Blob([bytes],{type:'application/pdf'}));
    ap.mergedAt=Date.now(); await saveTrip(t); renderTree();
    msg.textContent=`${out.getPageCount()}쪽 PDF를 저장했습니다.${dropped?` 영문 페이지 ${dropped}쪽은 뺐습니다.`:''}`;
  }catch(e){ msg.innerHTML=`<span class="err">${e.code==='declined'?'저장을 취소했습니다.':'PDF를 만들지 못했습니다: '+esc(e.message)}</span>`; }
}

/* ================= 결의 (승인 아래에 붙는 지급 서류) =================
   근거: docs/참고자료_분석_결의구조_2026-10-04.md
   최종 출장 결의 = 결과보고서 + 지급 증빙일체(출장복명서 → 출장 증빙 사진 → 출장 경비 정리 → 환율 정보 → 영수증 첨부철 스캔)
   영수증 원본 제출 의무가 있으므로 '영수증 첨부철'은 붙이기 전 상태로 따로 출력한다. */

const RCAT = ['항공','숙박비','식비','일비','교통비','통신비','보험','비자','기타'];
const GROUP_OF = c => c==='항공' ? '운임비' : c==='숙박비' ? '숙박비' : c==='식비' ? '식비' : '일비';   // 정산표 구분(실제 사례: 교통비·비자는 일비 칸 + 비고)
const GROUPS = ['운임비','숙박비','식비','일비'];
const addDays = (s, n) => { const d=d0(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dotDate = s => { const d=d0(s); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };
const PEOPLE_KEY = 'seojeong-people';   // 출장자 소속·계좌(이 브라우저에서 다시 쓰기 위한 편의 저장)
const people = (() => { try { return JSON.parse(localStorage.getItem(PEOPLE_KEY)||'{}'); } catch { return {}; } })();
const savePeople = () => { try { localStorage.setItem(PEOPLE_KEY, JSON.stringify(people)); } catch {} };

function ensureResolutions(ap){
  if (ap.resolutions?.length) return ap.resolutions;
  ap.resolutions = resolutionsFor(ap).map(r => ({ id: uid(), kind: r.k, name: r.n, hold: !!r.hold, receipts: [], photos: [], docs: {}, rates: {}, rateDate: '' }));
  return ap.resolutions;
}
function resStatus(rs){
  if (rs.mergedAt) return '<span class="pill ok">지급 증빙일체 완료</span>';
  if (rs.report) return '<span class="pill warn">작성 중</span>';
  if (rs.receipts.length) return '<span class="pill acc">정산 중</span>';
  return rs.hold ? '<span class="pill warn">구성 보류</span>' : '<span class="pill">작성 전</span>';
}

/* ---------- 금액 ---------- */
function rateFor(rs, cur){ return cur==='KRW' ? 1 : num(rs.rates[cur]?.rate); }
function krwOf(rs, x){
  if (x.krw) return Math.round(num(x.krw));                         // 카드 청구 원화가 있으면 그것을 우선
  if ((x.cur||'KRW')==='KRW') return Math.round(num(x.amt));
  const r = rateFor(rs, x.cur); return r ? Math.round(num(x.amt) * r) : 0;
}
function limitsFor(t, ap, rs){
  const lim = {운임비:0, 숙박비:0, 식비:0, 일비:0};
  if (ap.kind==='fee') return lim;
  travelBudget(t).rows.forEach(r => { const g = r.cat==='항공운임비' ? '운임비' : r.cat; if (lim[g]!==undefined) lim[g] += r.amt; });
  if (rs.kind==='card1') { lim.식비 = 0; lim.일비 = 0; }            // 1차(법카)는 항공·숙박만
  return lim;
}
function settle(t, ap, rs){
  const rows = rs.receipts.filter(x => !x.skip).map(x => ({...x, group: GROUP_OF(x.cat), won: krwOf(rs, x)}));
  const lim = limitsFor(t, ap, rs), by = {};
  GROUPS.forEach(g => { const items = rows.filter(r => r.group===g).sort((a,b)=>(a.date||'').localeCompare(b.date||'')); by[g] = {items, sum: items.reduce((s,r)=>s+r.won,0), limit: lim[g]}; });
  const total = GROUPS.reduce((s,g)=>s+by[g].sum,0), limitTotal = GROUPS.reduce((s,g)=>s+by[g].limit,0);
  const missingRate = [...new Set(rows.filter(r => (r.cur||'KRW')!=='KRW' && !r.krw && !rateFor(rs, r.cur)).map(r => r.cur))];
  return {by, total, limitTotal, missingRate, rows};
}
function priorPaid(ap, rs){   // 같은 승인의 앞선 결의에서 이미 지급한 금액(1차 → 최종)
  let sum = 0;
  for (const o of ap.resolutions) { if (o.id===rs.id) break; if (o.settledTotal) sum += o.settledTotal; }
  return sum;
}

/* ---------- 영수증 읽기 ---------- */
async function pdfPageImage(blob, page=1){
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported:false}).promise;
  const pg = await doc.getPage(page), vp = pg.getViewport({scale: 1.6}), c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height; await pg.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

출장 기간 ${t.start}~${t.end}, 출장자 ${names.join(', ')}. 음식점·카페는 식비, 택시·버스·지하철은 교통비.
${text ? '추출된 글자:\n' + text.slice(0, 6000) : '(이미지 참고)'}`, images.length && lim.images ? {images} : {}, 'quick');

function seedFromApproval(t, ap, rs){   // 개인카드로 미리 낸 항공·숙박은 승인 때 올린 결제 영수증을 그대로 쓴다
  if (rs.seeded || rs.kind!=='final' || ap.pay!=='personal') return;
  const pick = role => t.files.filter(f => f.role===role);
  const make = (cat, amt, role, label) => {
    const fs = pick(role);
    rs.receipts.push({id: uid(), fileId: fs[0]?.id, files: fs.map(f=>f.id), name: fs.map(f=>f.name).join(', ') || label, type: fs[0]?.type || 'application/pdf',
      url: fs[0]?.url, asset: fs[0]?.asset, local: fs[0]?.local, date: t.start, vendor: label, cur: 'KRW', amt, cat, a4: true, payer: koName(t.travelers[0]?.name), read: true, fromApproval: true});
  };
  if (t.flight) make('항공', t.flight, '항공 결제 영수증', '항공권');
  if (t.hotel) make('숙박비', t.hotel, '숙박 결제 영수증', '숙박비');
  rs.seeded = true;
}

function bindResSettle(t, ap, rs){
  const save = async (rerender=true) => { rs.settledTotal = settle(t, ap, rs).total; await saveTrip(t); if (rerender) renderRes($('#main')); };
  document.querySelectorAll('[data-pp]').forEach(el => el.onchange = () => { const [i,k]=el.dataset.pp.split(':'); const p=t.travelers[i]; p[k]=el.value.trim();
    const n=koName(p.name); people[n]={dept:p.dept||'',bank:p.bank||'',acct:p.acct||''}; savePeople(); save(false); });
  document.querySelectorAll('[data-rc]').forEach(el => el.onchange = () => { const [i,k]=el.dataset.rc.split(':'); const x=rs.receipts[i];
    x[k] = el.type==='checkbox' ? el.checked : k==='amt' ? num(el.value) : k==='cur' ? el.value.trim().toUpperCase() : el.value;
    if (k!=='skip' && k!=='a4') x.unsure=''; save(); });
  document.querySelectorAll('[data-rcdel]').forEach(b => b.onclick = async () => { const x=rs.receipts.splice(+b.dataset.rcdel,1)[0]; if (x && !x.fromApproval) await Files.remove({id:x.fileId, asset:x.asset, local:x.local}); save(); });
  const drop=$('#rcDrop'), fi=$('#rcFi');
  drop.onclick=()=>fi.click(); drop.ondragover=e=>{e.preventDefault(); drop.classList.add('over');}; drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('over'); addReceiptFiles(t, ap, rs, [...e.dataTransfer.files]);};
  fi.onchange=()=>addReceiptFiles(t, ap, rs, [...fi.files]);
  $('#rateDate').onchange = e => { rs.rateDate = e.target.value; save(); };
  document.querySelectorAll('[data-rate]').forEach(el => el.onchange = () => { const c=el.dataset.rate; rs.rates[c]={...(rs.rates[c]||{}), rate: el.value.replace(/,/g,'').trim()}; save(); });
  document.querySelectorAll('[data-fx]').forEach(a => a.onclick = async e => { e.preventDefault(); const c=a.dataset.fx;
    try { const j=await (await fetch('https://open.er-api.com/v6/latest/USD')).json(); const v=j.rates.KRW/j.rates[c]; if(!v) throw 0;
      rs.rates[c]={rate: String(Math.round(v*100)/100), source:'ExchangeRate-API'}; save(); toast('오늘 환율입니다. 기준일 환율과 다르면 고쳐 주세요.'); }
    catch { toast('환율을 불러오지 못했습니다. 구글에서 확인해 넣어 주세요.'); } });
  $('#rateCap').onchange = async e => { const f=e.target.files[0]; if(!f) return; const rec={id:uid(), name:f.name, type:f.type}; blobCache.set(rec.id,f);
    try { Object.assign(rec, await Files.put(f, rec.id)); } catch {} rs.docs.rateCap=rec; save(); };
  $('#dlXlsx').onclick = async () => { try { await Out.save(`${fileBase(ap)} 출장비 정산표.xlsx`.replace(/[\\/:*?"<>|]/g,'_'), settleXlsx(t, ap, rs)); } catch(e) { $('#stMsg').textContent='엑셀을 만들지 못했습니다: '+e.message; } };
}

/* 정산표 엑셀: 기존 '출장비 정산표_국가.xlsx'와 같은 열 */
const dotW = s => { const d=d0(s); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.(${WD[d.getDay()]})`; };
function settleTitle(t){ const n=dayCount(t.start,t.end); return `${dotW(t.start)}~${dotW(t.end)} 출장 경비 정리(${n-1}박 ${n}일)_${t.travelers.length}인 (${t.travelers.map(p=>koName(p.name)).join(',')})`; }
function settleXlsx(t, ap, rs){
  if (typeof XLSX==='undefined') throw new Error('엑셀 기능을 불러오지 못했습니다.');
  const st = settle(t, ap, rs), curs = [...new Set(st.rows.map(r=>r.cur).filter(c=>c&&c!=='KRW'))].slice(0,3);
  const head = ['연번','구분','내용','일자','1) KRW', ...curs.map((c,i)=>`${i+2}) ${c}`), '환산금액(KRW)','합계금액(KRW)','한도','한도 잔액','비고'];
  const aoa = [[settleTitle(t)], head]; let n = 0;
  GROUPS.forEach(g => { const b = st.by[g]; b.items.forEach((r, i) => { n++;
    aoa.push([n, i===0?g:'', i===0?(g==='운임비'?'항공권':g):'', r.date||'', (r.cur||'KRW')==='KRW'?num(r.amt):'', ...curs.map(c=>r.cur===c?num(r.amt):''), r.won,
      i===0?b.sum:'', i===0?b.limit:'', i===0?b.limit-b.sum:'', ['교통비','통신비','보험','비자','기타'].includes(r.cat)?r.cat:(r.vendor||'')]); }); });
  aoa.push(['합계','','','','',...curs.map(()=>''), st.total, st.total, st.limitTotal, st.limitTotal-st.total, '']);
  aoa.push([]); aoa.push(['화폐','환율','기준일']);
  curs.forEach(c => aoa.push([c, num(rs.rates[c]?.rate), rs.rateDate]));
  const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();
  ws['!cols'] = head.map((h,i)=>({wch: i===2||i===head.length-1?16:12}));
  XLSX.utils.book_append_sheet(wb, ws, '정산표');
  return new Blob([XLSX.write(wb, {type:'array', bookType:'xlsx'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* HTML 조각들을 A4 PDF로 (페이지마다 따로 그린다) */
async function htmlToPdf(htmlOrPages, opts={}){
  const pages = [].concat(htmlOrPages), {PDFDocument} = PDFLib, pdf = await PDFDocument.create();
  const W = opts.landscape ? 841.89 : 595.28, H = opts.landscape ? 595.28 : 841.89, pxW = opts.landscape ? 1123 : 794;
  for (const html of pages) {
    const holder = document.createElement('div'); holder.style.cssText = `position:fixed;left:-20000px;top:0;width:${pxW}px;background:#fff`;
    holder.innerHTML = html; document.body.append(holder);
    const paper = holder.querySelector('.paper') || holder; paper.style.width = pxW+'px'; paper.style.maxWidth='none'; paper.style.minWidth='0'; paper.style.boxShadow='none'; paper.style.margin='0';
    try {
      await document.fonts.ready; await Promise.all([...holder.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
      const canvas = await html2canvas(paper, {scale: 2, backgroundColor: '#ffffff'});
      const per = Math.floor(canvas.width * H / W);
      for (let y = 0; y < canvas.height; y += per) {
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = per; const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(canvas, 0, y, canvas.width, Math.min(per, canvas.height - y), 0, 0, canvas.width, Math.min(per, canvas.height - y));
        const img = await pdf.embedJpg(await (await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92))).arrayBuffer());
        pdf.addPage([W, H]).drawImage(img, {x: 0, y: 0, width: W, height: H});
        if (canvas.height - y - per < 40) break;   // 남은 여백뿐이면 빈 쪽을 만들지 않는다
      }
    } finally { holder.remove(); }
  }
  return new Blob([await pdf.save()], {type: 'application/pdf'});
}

      if (rs.photos.length) await addPdf(await htmlToPdf(await photosPageHTML(rs)));
      if (st.rows.length) await addPdf(await htmlToPdf(settlePageHTML(t, ap, rs), {landscape: true}));
      if (Object.keys(rs.rates).some(c => rs.rates[c]?.rate)) await addPdf(await htmlToPdf(await ratePageHTML(rs)));
      if (rs.docs.attachScan) await addPdf(await fileBlob(rs.docs.attachScan));
      if (!out.getPageCount()) { msg.textContent = '합칠 자료가 없습니다.'; return; }
      await Out.save(`${fileBase(ap)} ${rs.kind==='final'&&ap.resolutions.length>1?'최종 ':''}지급 증빙일체.pdf`.replace(/[\\/:*?"<>|]/g,'_'), new Blob([await out.save()], {type:'application/pdf'}));
      rs.mergedAt = Date.now(); rs.settledTotal = st.total; await saveTrip(t); renderTree();
      msg.textContent = `${out.getPageCount()}쪽 PDF를 저장했습니다.${rs.docs.attachScan?'':' 영수증 첨부철 스캔본은 아직 없어 빠졌습니다.'}`;
    } catch (e) { msg.textContent = '만들지 못했습니다: ' + e.message; }
  };
}


boot();
</script>
</body></html>
